<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work-GO Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap">
<style>
/* Layout: guía de escenarios a la izquierda, dispositivo al centro; en móvil se apilan. La app vive dentro del teléfono con su propia paleta fija (azul Work + amarillo Go). */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#16263A; --muted:#5B6B80; --line:#D6DEE8;
  --brand:#155A97; --brand-ink:#FFFFFF; --go:#F5B301; --soft:#E3ECF6;
  --font:"Ubuntu", "Segoe UI", system-ui, sans-serif; --mono:"Ubuntu Mono", ui-monospace, monospace;
  /* paleta fija de la app (pantalla del teléfono) */
  --a-bg:#FFFFFF; --a-ink:#14202E; --a-mut:#6A7889; --a-line:#E3E8EF; --a-soft:#F2F5F9;
  --a-blue:#155A97; --a-blue2:#0E4677; --a-sky:#E4EEF8; --a-go:#F5B301; --a-go-soft:#FFF4D6;
  --a-ok:#22955A; --a-ok-soft:#E3F4EA; --a-red:#C8372D; --a-red-soft:#FBE7E5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --panel:#172231; --ink:#E6EDF6; --muted:#9AAABD; --line:#2A3A4F; --brand:#5EA2E0; --brand-ink:#0B1420; --soft:#1E2D40; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1722; --panel:#172231; --ink:#E6EDF6; --muted:#9AAABD; --line:#2A3A4F; --brand:#5EA2E0; --brand-ink:#0B1420; --soft:#1E2D40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.top{max-width:1240px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.logo{font-weight:700;font-size:26px;letter-spacing:-.5px}
.logo b{color:var(--brand)} .logo i{font-style:normal;color:var(--go)}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stage{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;gap:28px;align-items:start}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.guide .role{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.guide h2{margin:4px 0 6px;font-size:20px;text-wrap:balance}
.guide .sc{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:s}
.steps li button{width:100%;text-align:left;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;background:none;border:0;color:var(--ink);padding:7px 6px;border-radius:10px;font-size:14px;line-height:1.35}
.steps li button:hover{background:var(--soft)}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.steps li.done .n{background:var(--soft);border-color:var(--soft);color:var(--brand)}
.steps li.cur button{background:var(--soft)}
.steps li.cur .n{background:var(--go);border-color:var(--go);color:#1d1600}
.feat{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.45}
.feat b{color:var(--ink);font-weight:500}
.gbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.gbtns button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:7px 12px;font-size:13px}
.gbtns label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dev{display:flex;justify-content:center;min-width:0}
/* teléfono */
.phone{width:390px;max-width:100%;height:800px;background:#0C0F14;border-radius:54px;padding:12px;box-shadow:0 30px 60px -30px rgba(10,30,60,.45),0 0 0 2px #2b3038 inset;position:relative}
.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0C0F14;border-radius:20px;z-index:5}
.screen{background:var(--a-bg);color:var(--a-ink);border-radius:42px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-weight:700;font-size:15px}
.status .sig{display:flex;gap:5px;align-items:center}
.appbar{flex:none;display:flex;align-items:center;justify-content:center;height:40px;position:relative}
.appbar .wm{font-weight:700;font-size:20px;color:var(--a-blue)} .appbar .wm i{font-style:normal;color:var(--a-go)}
.appbar .back{position:absolute;left:14px;border:0;background:var(--a-soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--a-ink)}
.appbar .bell{position:absolute;right:16px;border:0;background:none;color:var(--a-ink)}
.body{flex:1;overflow-y:auto;padding:6px 18px 18px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--a-line);padding:8px 10px 22px;background:var(--a-bg)}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;color:#A9B6C6}
.nav button.on{color:var(--a-blue);font-weight:700}
/* piezas de la app */
.h1{font-size:28px;font-weight:700;margin:6px 0 12px;letter-spacing:-.4px;text-wrap:balance}
.h2{font-size:19px;font-weight:700;margin:18px 0 10px}
.sub{color:var(--a-mut);font-size:14px;line-height:1.4;margin:-4px 0 14px}
.search{display:flex;align-items:center;gap:10px;background:var(--a-soft);border-radius:999px;padding:12px 16px;color:var(--a-mut);font-size:15px}
.urg{margin-top:14px;border-radius:20px;background:var(--a-blue);color:#fff;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border:0;text-align:left;width:100%}
.urg b{font-size:17px} .urg span{font-size:13px;opacity:.85;line-height:1.35}
.urg .bolt{grid-row:1/3;grid-column:2;width:48px;height:48px;border-radius:50%;background:var(--a-go);display:grid;place-items:center;color:#2a1d00}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.cat{border:0;background:none;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--a-blue)}
.cat .ic{width:66px;height:66px;border-radius:50%;background:var(--a-blue);display:grid;place-items:center;color:#fff}
.ad{margin-top:16px;border:1px dashed #D9C27A;background:var(--a-go-soft);border-radius:16px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.ad .tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:#fff;border-radius:6px;padding:2px 6px;color:#7a6200;font-weight:700;flex:none}
.card{border:1px solid var(--a-line);border-radius:18px;padding:14px;background:#fff}
.row{display:flex;gap:12px;align-items:center}
.col{display:grid;gap:10px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;position:relative;font-size:18px}
.av.lg{width:84px;height:84px;font-size:28px}
.av .dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--a-ok);border:2px solid #fff}
.nm{font-weight:700;font-size:16px} .rl{color:var(--a-mut);font-size:13px}
.stars{display:inline-flex;gap:1px;color:var(--a-go);vertical-align:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--a-line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;color:var(--a-ink)}
.chip.on{background:var(--a-sky);border-color:#B9D2EA;color:var(--a-blue2);font-weight:500}
.ver{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--a-ok);background:var(--a-ok-soft);border-radius:999px;padding:3px 8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--a-mut);margin-top:6px}
.price{font-weight:700;color:var(--a-blue2)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;background:var(--a-blue);color:#fff;display:flex;gap:8px;align-items:center;justify-content:center}
.btn.go{background:var(--a-go);color:#241a00}
.btn.ghost{background:var(--a-soft);color:var(--a-ink)}
.btn.red{background:var(--a-red-soft);color:var(--a-red)}
.btn.sm{padding:10px 12px;font-size:14px;border-radius:12px;width:auto}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}
.lbl{font-size:13px;font-weight:700;margin:14px 0 6px;display:block}
.inp{width:100%;border:1px solid var(--a-line);border-radius:14px;padding:12px;font:inherit;font-size:14px;color:var(--a-ink);background:#fff;resize:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--a-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 6px;font-size:13px;color:var(--a-mut)}
.seg button.on{background:#fff;color:var(--a-blue2);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--a-line);border-radius:14px;padding:12px;margin-top:10px;width:100%;background:#fff;text-align:left;color:var(--a-ink)}
.tog .sw{width:46px;height:28px;border-radius:999px;background:#CBD5E1;position:relative;flex:none;transition:background .2s}
.tog .sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:var(--a-go)} .tog.on .sw:after{left:21px}
.tog small{display:block;color:var(--a-mut);font-size:12px;margin-top:2px;line-height:1.35}
.note{font-size:12px;color:var(--a-mut);line-height:1.4;display:flex;gap:6px;align-items:flex-start;margin-top:10px}
.warn{background:var(--a-go-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:10px;color:#4d3a00}
.okbox{background:var(--a-ok-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:#14532f}
.thumb{width:64px;height:64px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl li:before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--a-line)}
.tl li:last-child:before{display:none}
.tl .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--a-line);background:#fff;display:grid;place-items:center;color:#fff}
.tl li.ok .b{background:var(--a-ok);border-color:var(--a-ok)}
.tl li.now .b{background:var(--a-go);border-color:var(--a-go)}
.tl .t{font-size:14px;font-weight:500} .tl .d{font-size:12px;color:var(--a-mut)}
.code{display:flex;gap:8px;justify-content:center;margin:8px 0}
.code span{width:52px;height:64px;border-radius:16px;border:2px solid var(--a-blue);display:grid;place-items:center;font-size:30px;font-weight:700;font-family:var(--mono);color:var(--a-blue2);background:var(--a-sky)}
.code input{width:52px;height:64px;border-radius:16px;border:1.5px solid #B8C3D1;text-align:center;font-size:28px;font-family:var(--mono);color:var(--a-ink)}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid var(--a-line)}
.ln:last-child{border-bottom:0}
.ln.tot{font-weight:700;font-size:16px;border-top:2px solid var(--a-ink);border-bottom:0;margin-top:4px;padding-top:10px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.port div{aspect-ratio:1;border-radius:12px;display:grid;place-items:end start;padding:6px;font-size:10px;color:#fff;font-weight:500;max-width:100%}
.rev{border-top:1px solid var(--a-line);padding:10px 0;font-size:13px;line-height:1.4}
.rev .w{display:flex;justify-content:space-between;font-weight:500;margin-bottom:3px}
.rev .c{font-size:11px;color:var(--a-ok);display:flex;gap:4px;align-items:center;margin-top:4px}
.center{text-align:center}
.big-ic{width:86px;height:86px;border-radius:50%;margin:18px auto 10px;display:grid;place-items:center}
.pulse{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(245,179,1,.55)}50%{box-shadow:0 0 0 14px rgba(245,179,1,0)}}
.spin{width:70px;height:70px;border-radius:50%;border:6px solid var(--a-sky);border-top-color:var(--a-blue);margin:30px auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.nx{position:relative}
.hints .nx{animation:pl 1.6s ease-in-out infinite}
.toast{position:absolute;left:16px;right:16px;top:58px;background:#14202E;color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .3s ease}
@keyframes tin{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.share{border-radius:20px;overflow:hidden;border:1px solid var(--a-line)}
.share .hd{background:var(--a-blue);color:#fff;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between}
.share .bd{padding:14px;display:grid;gap:10px}
.stars-in{display:flex;gap:6px;justify-content:center;margin:10px 0}
.stars-in button{border:0;background:none;color:#D5DCE5;padding:0}
.stars-in button.on{color:var(--a-go)}
.pay{display:grid;gap:8px}
.pay button{display:flex;gap:12px;align-items:center;border:1.5px solid var(--a-line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-size:14px;color:var(--a-ink)}
.pay button.on{border-color:var(--a-blue);background:var(--a-sky)}
.pay small{display:block;color:var(--a-mut);font-size:12px}
.wk{background:linear-gradient(160deg,#155A97,#0E4677);color:#fff;border-radius:20px;padding:16px}
.wk .k{font-size:12px;opacity:.8} .wk .v{font-size:28px;font-weight:700}
.req{border:2px solid var(--a-go);border-radius:18px;padding:14px;background:#fff}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px}
.badge.u{background:var(--a-red-soft);color:var(--a-red)} .badge.b{background:var(--a-sky);color:var(--a-blue2)}
.up{display:flex;gap:12px;align-items:center;border:1px solid var(--a-line);border-radius:14px;padding:12px}
.up .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--a-ok)}
.up .ic{width:40px;height:40px;border-radius:12px;background:var(--a-sky);display:grid;place-items:center;color:var(--a-blue);flex:none}
/* panel web */
.browser{width:min(1000px,100%);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,30,60,.4);border:1px solid #cfd8e3;color:var(--a-ink)}
.bwrap{overflow-x:auto;width:100%;display:flex;justify-content:center}
.bbar{background:#E9EEF4;padding:10px 14px;display:flex;gap:10px;align-items:center}
.bbar i{width:11px;height:11px;border-radius:50%;background:#C9D2DD;display:block}
.bbar .url{flex:1;background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;color:#5b6b80;font-family:var(--mono)}
.adm{display:grid;grid-template-columns:200px 1fr;min-height:640px;min-width:860px}
.side{background:#0E2F52;color:#cfe0f2;padding:18px 12px;display:grid;align-content:start;gap:4px}
.side .wm{font-weight:700;font-size:20px;color:#fff;margin:0 8px 16px} .side .wm i{font-style:normal;color:var(--a-go)}
.side button{border:0;background:none;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.side button.on{background:#1B4A7A;color:#fff;font-weight:500}
.side .cnt{background:var(--a-go);color:#241a00;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.main{padding:22px 26px;background:#F5F7FA}
.main h3{margin:0 0 4px;font-size:22px} .main .sub{margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--a-line);border-radius:14px;padding:14px}
.kpi .k{font-size:12px;color:var(--a-mut)} .kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.al{border-color:#F1D27A;background:#FFFBEF}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--a-line);border-radius:14px;overflow:hidden;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--a-mut);padding:10px 12px;background:#FAFBFD;border-bottom:1px solid var(--a-line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--a-line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#F3F7FC}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.pill.y{background:var(--a-go-soft);color:#7a5a00} .pill.g{background:var(--a-ok-soft);color:#14532f} .pill.r{background:var(--a-red-soft);color:var(--a-red)} .pill.b{background:var(--a-sky);color:var(--a-blue2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:#fff;border:1px solid var(--a-line);border-radius:14px;padding:16px}
.box h4{margin:0 0 10px;font-size:15px}
.doc{border-radius:10px;height:110px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:500;text-align:center;padding:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0}
.chk .b{width:20px;height:20px;border-radius:6px;background:var(--a-ok);color:#fff;display:grid;place-items:center;flex:none}
.abtn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;background:var(--a-blue);color:#fff}
.abtn.g{background:var(--a-ok)} .abtn.r{background:var(--a-red-soft);color:var(--a-red)} .abtn.w{background:#fff;border:1px solid var(--a-line);color:var(--a-ink)}
.modal{position:absolute;inset:0;background:rgba(10,20,35,.45);display:grid;place-items:center;z-index:30}
.modal .m{background:#fff;border-radius:16px;padding:20px;width:380px;max-width:90%}
.relative{position:relative}
@media (max-width:900px){.stage{grid-template-columns:1fr}.guide{position:static;order:2}}
@media (max-width:440px){.phone{height:760px;border-radius:44px;padding:8px}.screen{border-radius:36px}.phone:before{top:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="logo"><b>Work</b><i>Go</i> <span style="font-weight:400;font-size:16px;color:var(--muted)">· prototipo navegable</span></div>
    <p>Elige un escenario y sigue los pasos, o toca directamente la pantalla.</p>
  </div>
  <nav class="tabs" id="tabs" aria-label="Escenarios"></nav>
</header>
<main class="stage">
  <aside class="guide" id="guide" aria-live="polite"></aside>
  <section class="dev" id="dev"></section>
</main>

<script>
(function(){

/* ---------- motor ---------- */
const START={cliente:'c-login',familiar:'c-login',urbanizacion:'c-login',trabajador:'w-reg',panel:'a-dash'};
function toast(msg){const s=document.querySelector('.screen')||document.querySelector('.adm');if(!s)return;const t=document.createElement('div');t.className='toast';t.innerHTML=I('bell',18)+'<span>'+msg+'</span>';s.appendChild(t);timers.push(setTimeout(()=>t.remove(),2600));}
function go(id){timers.forEach(clearTimeout);timers=[];S.scr=id;render();
 const c=C();
 if(id==='c-wait')timers.push(setTimeout(()=>{S.tmp.st=1;go('c-status');setTimeout(()=>toast((cw().n.split(' ')[0])+' aceptó. Llega aprox. a las '+cw().eta+'.'),50)},2200));
 if(id==='c-auto'&&!S.tmp.autoDone)timers.push(setTimeout(()=>{S.tmp.autoDone=1;S.tmp.st=1;render();},2400));
 if(id==='w-home'&&S.tmp.avail!==false)timers.push(setTimeout(()=>toast('Nueva solicitud urgente en vía a la Costa'),500));
}
function setSc(sc){S={sc,scr:START[sc],tmp:{}};try{history.replaceState(null,'','#'+sc)}catch(e){}go(START[sc]);}
function render(){
 const c=C();
 document.getElementById('tabs').innerHTML=ORDER.map(k=>`<button aria-pressed="${k===S.sc}" data-sc="${k}">${SC[k].tab}</button>`).join('');
 const ids=c.steps.map(s=>s[0]);let cur=ids.indexOf(S.scr);
 if(cur<0){const map={'c-login':-1,'c-report':-2,'c-act':-2,'c-me':-2};cur=map[S.scr]??-1;if(S.scr==='c-rcpt'&&cur<0)cur=ids.length;}
 if(cur>-1)S.tmp.maxStep=Math.max(S.tmp.maxStep||0,cur);
 document.getElementById('guide').innerHTML=`<div class="role">${c.role}</div><h2>${c.title}</h2><p class="sc">${c.story}</p>
 <ol class="steps">${c.steps.map((s,i)=>`<li class="${i===cur?'cur':(i<=(S.tmp.maxStep??-1)?'done':'')}"><button data-go="${s[0]}"><span class="n">${i<(S.tmp.maxStep??-1)&&i!==cur?I('check',12,3):i+1}</span><span>${s[1]}</span></button></li>`).join('')}</ol>
 <div class="feat"><b>Funcionalidades de la Tabla 7:</b> ${c.feats}</div>
 <div class="gbtns"><button data-sc="${S.sc}">Reiniciar escenario</button><label><input type="checkbox" id="hint" ${hints?'checked':''}> Resaltar siguiente acción</label></div>`;
 const dev=document.getElementById('dev');
 if(S.sc==='panel'){dev.innerHTML=`<div class="bwrap ${hints?'hints':''}">${X[S.scr]()}</div>`;}
 else{const y=document.getElementById('appbody')?.scrollTop||0;const same=dev.dataset.scr===S.scr;dev.innerHTML=`<div class="phone"><div class="screen ${hints?'hints':''}">${X[S.scr]()}</div></div>`;if(same){const b=document.getElementById('appbody');if(b)b.scrollTop=y;}}
 dev.dataset.scr=S.scr;
}
document.addEventListener('change',e=>{if(e.target.id==='hint'){hints=e.target.checked;render();}});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-sc],[data-go],[data-act]');if(!t)return;
 if(t.dataset.sc){setSc(t.dataset.sc);return;}
 const c=C();
 if(t.dataset.cat){const cat=t.dataset.cat;if(cat!==c.cat){toast('En este escenario la solicitud es de '+c.cat+'.');return;}}
 if(t.dataset.urg){S.tmp.urgent=true;S.tmp.mode='auto';}
 if(t.dataset.w)S.tmp.pick=t.dataset.w;
 if(t.dataset.go){if(t.dataset.go==='c-form'&&!t.dataset.urg&&S.tmp.urgent===undefined){}go(t.dataset.go);return;}
 const a=t.dataset.act,T=S.tmp;
 const acts={
  other0(){T.other=false},other1(){T.other=true},'when-now'(){T.when='now'},'when-prog'(){T.when='prog'},
  urg(){T.urgent=!T.urgent;if(T.urgent)T.mode='auto'},'mode-manual'(){T.mode='manual'},'mode-auto'(){T.mode='auto'},
  submit(){if(c.other&&!T.other){toast('Cambia a “Otra dirección”: el servicio es para '+(c.recv||'otra dirección')+'.');return 1}go(T.mode==='auto'?'c-auto':'c-list');return 1},
  arrive(){T.st=2;go('c-quote');toast(cw().n.split(' ')[0]+' llegó y confirmó el inicio con tu código.');return 1},
  send(){T.sent=1;if(S.sc!=='trabajador')toast('Datos y código enviados.')},
  approve(){go('c-close');toast('Cotización aprobada. El trabajo comenzó.');return 1},
  'pm-card'(){T.pm='card'},'pm-cash'(){T.pm='cash'},
  pay(){go(c.rate?'c-rate':'c-rcpt');if(!c.rate)toast('Pago realizado: '+money(total(c)));return 1},
  pdf(){toast('Comprobante '+c.id+' descargado.')},pdf2(){toast('Reporte de noviembre exportado para la directiva.')},
  reportsend(){toast('Reclamo enviado. Te responderemos en menos de 24 horas.')},
  approved(){go('w-ok');return 1},avail(){T.avail=T.avail===false?true:false},
  reject(){toast('Solicitud rechazada. Se ofrecerá a otro trabajador.')},
  eta20(){T.eta='20'},eta30(){T.eta='30'},eta45(){T.eta='45'},eta60(){T.eta='60'},
  fill(){T.fill=1},qsend(){T.qs=1;toast('Patricia aprobó la cotización.')},workdone(){T.fill=0;go('w-end');return 1},
  aprobar(){T.approved=1;go('a-ver');return 1},
  reemb(){T.modal=`<div class="modal"><div class="m"><h4 style="margin:0 0 8px">Confirmar reembolso parcial</h4><p class="sub" style="margin:0 0 14px">Se devolverán USD 30,00 a Gabriel Cedeño y se descontarán del saldo de Fabricio León. Ambos recibirán la decisión.</p><div class="row" style="gap:8px;justify-content:flex-end"><button class="abtn w" data-act="mclose">Cancelar</button><button class="abtn g nx" data-act="mok">Confirmar</button></div></div></div>`},
  mclose(){T.modal=''},mok(){T.modal='';T.resolved=1;go('a-rec');return 1}
 };
 if(a&&a[0]==='r'&&/^r\d$/.test(a)){T.r=+a[1];render();return;}
 if(acts[a]){const done=acts[a]();if(!done)render();}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SC[h]&&h!==S.sc)setSc(h);});
const h=location.hash.slice(1);setSc(SC[h]?h:'cliente');
})();
</script>
